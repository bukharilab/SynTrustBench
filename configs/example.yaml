dataset:
  name: demo_clinical_cohort
  modality: tabular
  outcome: readmission

columns:
  continuous:
    - age
    - bmi
    - sbp
    - dbp
    - los
  categorical:
    - sex
    - race
  binary:
    - diabetes
    - hypertension
    - readmission

protected_attributes:
  - sex
  - race

clinical_constraints:
  - "age >= 18"
  - "bmi > 0"
  - "sbp >= dbp"

utility_task:
  type: binary_classification
  target: readmission
  positive_label: "1"

generator:
  name: gaussian_copula_demo
  seed: 42

uncertainty:
  bootstrap_iterations: 200
  confidence_level: 0.95
  random_seed: 42

subgroup_analysis:
  minimum_n: 30
  minimum_outcomes_per_class: 10

privacy:
  exact_duplicate_decimals: 10
  distance_max_rows: 10000
  attack_max_rows: 10000

robustness:
  downstream_model_seeds: [42, 43, 44, 45, 46]
  missingness_rates: [0.05, 0.10, 0.20]
  training_size_fractions: [0.25, 0.50, 0.75, 1.0]

# Thresholds may be overridden here. Defaults are provisional research
# decisions and are not clinically validated or regulatory cutoffs.
# thresholds:
#   utility_retention_fail: 0.80
#   utility_retention_conditional: 0.90
